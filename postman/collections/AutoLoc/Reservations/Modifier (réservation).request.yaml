$kind: http-request
url: "{{baseUrl}}/api/reservations/{{reservationId}}"
method: PUT
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-11-10",
      "dateFin": "2026-11-20",
      "statut": "TERMINEE"
    }
scripts:
