$kind: http-request
name: "Créer (agence invalide : nom vide) - 400"
url: "{{baseUrl}}/api/agences"
method: POST
body:
  type: json
  content: |-
    {
      "nom": "",
      "ville": "Tunis",
      "adresse": "12 Avenue Habib Bourguiba",
      "telephone": "71123456"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
