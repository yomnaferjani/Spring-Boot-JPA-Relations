$kind: http-request
name: "Créer (employé invalide : nom vide) - 400"
url: "{{baseUrl}}/api/employes"
method: POST
body:
  type: json
  content: |-
    {
      "nom": "",
      "prenom": "Sami",
      "role": "AGENT",
      "agence": { "idAgence": {{agenceId}} }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
