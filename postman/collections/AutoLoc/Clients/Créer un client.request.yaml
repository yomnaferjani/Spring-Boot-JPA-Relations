$kind: http-request
url: "{{baseUrl}}/api/clients"
method: POST
body:
  type: json
  content: |-
    {
      "nom": "Ben Salah",
      "prenom": "Ali",
      "email": "ali.bensalah@example.com",
      "telephone": "20123456",
      "numPermis": "P-123456",
      "dateInscription": "2026-10-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("clientId", pm.response.json().idClient);
    language: text/javascript
order: 2000
