$kind: http-request
name: "Créer (maintenance invalide : date de fin antérieure à la date de début) - 400"
url: "{{baseUrl}}/api/maintenances"
method: POST
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-12-01",
      "dateFin": "2026-11-30",
      "description": "Vidange",
      "vehicule": { "idVehicule": {{vehiculeId}} }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
