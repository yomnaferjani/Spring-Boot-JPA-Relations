$kind: http-request
url: "{{baseUrl}}/api/vehicules/{{vehiculeId}}"
method: PUT
body:
  type: json
  content: |-
    {
      "immatriculation": "123 TUN 4567",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": 95.00,
      "statut": "DISPONIBLE"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
