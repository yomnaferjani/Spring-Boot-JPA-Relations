$kind: http-request
name: "Créer (véhicule invalide : tarif journalier négatif) - 400"
url: "{{baseUrl}}/api/vehicules"
method: POST
body:
  type: json
  content: |-
    {
      "immatriculation": "999 TUN 0001",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": -10,
      "statut": "DISPONIBLE"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
