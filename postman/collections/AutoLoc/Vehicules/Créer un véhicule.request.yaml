$kind: http-request
url: "{{baseUrl}}/api/vehicules"
method: POST
body:
  type: json
  content: |-
    {
      "immatriculation": "123 TUN 4567",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": 90.00,
      "statut": "DISPONIBLE",
      "agence": { "idAgence": {{agenceId}} },
      "equipements": [ { "idEquipement": {{equipementId}} } ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("vehiculeId", pm.response.json().idVehicule);
    language: text/javascript
order: 2000
